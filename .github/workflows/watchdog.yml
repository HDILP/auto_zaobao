name: 早报发布看门狗 (Watchdog)

# 为什么需要它：GitHub 托管 runner 偶发 "runner lost communication with the
# server"，这种失败发生在平台侧，job 内部任何 retry 都救不了（2026-11-07 那次
# 就是文章已经发布成功、随后 runner 失联，整轮被判失败）。
#
# 判断逻辑（宁可不动，也不误发）：
#   1. publish_state.json 的日期已经是今天  -> 已发布，什么都不做
#   2. 今天有 run 还在跑                      -> 不打扰
#   3. 今天有 run 且已经成功                 -> 不补发
#   4. 今天没有任何 zaobao.yml 的 run        -> 上游没推数据，不补发（避免拿旧闻充今天）
#   5. 今天有 run 但全部失败、没有成功        -> 补发一次（allow_republish=false，保证不重复发文）

on:
  schedule:
    # 北京时间 17:30 / 21:30 / 23:30，都晚于正常发布窗口（14:00-16:30 CST）
    - cron: '30 9 * * *'
    - cron: '30 13 * * *'
    - cron: '30 15 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '忽略所有判断，强制走一次补发链路（仅用于验证）'
        type: boolean
        default: false

permissions:
  actions: write   # 需要 dispatch 其它 workflow
  contents: read   # 读取 publish_state.json

concurrency:
  group: zaobao-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 判断今天是否该补发
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TODAY=$(TZ=Asia/Shanghai date +%F)
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"

          # 今天 00:00 (CST) 对应的 UTC 时间，用来过滤 run
          START_UTC=$(python3 -c "
          from datetime import datetime, timezone, timedelta
          tz = timezone(timedelta(hours=8))
          d = datetime.now(tz).replace(hour=0, minute=0, second=0, microsecond=0)
          print(d.astimezone(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'))
          ")
          echo "今天起点(UTC): $START_UTC"

          if [ -f publish_state.json ]; then
            LAST=$(python3 -c 'import json;print(json.load(open("publish_state.json")).get("date",""))')
            ARTICLE=$(python3 -c 'import json;print(json.load(open("publish_state.json")).get("article_id",""))')
          else
            LAST=""
            ARTICLE=""
          fi
          echo "state_date=$LAST  article_id=$ARTICLE"

          # 拉今天所有 zaobao.yml 的 run
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/zaobao.yml/runs?per_page=60" \
            > all_runs.json

          STATS=$(START_UTC="$START_UTC" python3 -c '
          import json, os
          runs = json.load(open("all_runs.json"))["workflow_runs"]
          start = os.environ["START_UTC"]
          today = [r for r in runs if r["created_at"] >= start]
          json.dump(today, open("today_runs.json", "w"))
          total = len(today)
          success = sum(1 for r in today if r["conclusion"] == "success")
          running = sum(1 for r in today if r["status"] != "completed")
          print(total, success, running)
          ')
          read -r TOTAL SUCCESS RUNNING <<< "$STATS"

          echo "今天 run 数=$TOTAL 成功=$SUCCESS 未完成=$RUNNING"
          echo "today_runs=$TOTAL" >> "$GITHUB_OUTPUT"

          DECISION="skip"

          if [ "$LAST" = "$TODAY" ]; then
            echo "✅ 跳过：状态文件显示今天已发布（文章 id：${ARTICLE:-?}）"
          elif [ "$RUNNING" -gt 0 ]; then
            echo "⏳ 跳过：今天已有 run 正在运行，不打扰"
          elif [ "$SUCCESS" -gt 0 ]; then
            echo "✅ 跳过：今天已有成功的 run"
          elif [ "$TOTAL" -eq 0 ]; then
            echo "🤷 跳过：今天还没有任何 run（上游 zaobao_v2 未推送数据？），不补发，避免发布过期内容"
          else
            DECISION="dispatch"
            echo "⚠️ 补发：今天有 $TOTAL 个 run 但全部失败，触发一轮补发"
          fi

          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"

      - name: 补发早报
        if: steps.state.outputs.decision == 'dispatch' || inputs.force
        env:
          GH_TOKEN: ${{ secrets.REPO_DISPATCH_PAT || github.token }}
        run: |
          # allow_republish=false：即使状态文件没来得及提交，脚本内还有按日期兜底，
          # 绝不会同一天发两篇。
          gh workflow run zaobao.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "${GITHUB_REF_NAME}" \
            -f allow_republish=false
          echo "已触发 zaobao.yml（allow_republish=false），稍后到 Actions 页确认结果。"
