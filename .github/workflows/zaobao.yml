name: 每日早报自动发布 (Daily Auto Post)

on:
  repository_dispatch:
    types: [zaobao] # 这里的名字必须和上面发送的名字一致
  workflow_dispatch:

jobs:
  auto-post:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      CONFIG: ${{ secrets.CONFIG }}
    steps:
      - name: Set timezone
        run: |
          sudo timedatectl set-timezone $TZ
      - name: Check time
        run: date

      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-wqy-zenhei

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        # 这里增加了 requests 库
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install chromium

      - name: Capture Screenshots
        env:
          # 填入你的 Vercel 地址
          TARGET_URL: 'https://zaobao-v2.hdilp.top' 
        run: python capture_zaobao.py

      - name: Upload and Publish
        # 运行发布脚本
        run: python publish_zaobao.py

      # (可选) 依然保留上传构建产物，方便排查错误
      - name: Upload screenshots artifact
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-backup
          path: screenshots/
          retention-days: 3
