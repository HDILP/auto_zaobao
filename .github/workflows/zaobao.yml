name: 每日早报自动发布 (Daily Auto Post)

on:
  repository_dispatch:
    types: [zaobao] # 必须与 zaobao_v2 中发送的事件名一致
  workflow_dispatch:
    inputs:
      allow_republish:
        description: '当天已发布过也强制再发一次（看门狗自动重试时传 false）'
        type: string
        default: 'true'

# 需要写权限来提交 publish_state.json（用于幂等去重）
permissions:
  contents: write

# 同一时间只允许一个发布任务，避免连环重试互相踩
concurrency:
  group: zaobao-publish
  cancel-in-progress: false

jobs:
  auto-post:
    runs-on: ubuntu-latest
    # 单个 job 最长 20 分钟；超过即判失败，交给 watchdog.yml 重试
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
      CONFIG: ${{ secrets.CONFIG }}
      # repository_dispatch 没有 inputs，走默认 true；看门狗显式传 false
      ALLOW_REPUBLISH: ${{ inputs.allow_republish || 'true' }}
    steps:
      - name: Set timezone
        run: sudo timedatectl set-timezone "$TZ"

      - name: Check time
        run: date

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # 需要最新提交来读取 publish_state.json
          fetch-depth: 1

      - name: Install Chinese fonts
        run: |
          # apt 源偶发抖动，3 次重试
          retry() { for i in 1 2 3; do "$@" && return 0; echo "第 $i 次失败，10s 后重试: $*"; sleep 10; done; return 1; }
          retry sudo apt-get update -o Acquire::Retries=3
          retry sudo apt-get install -y fonts-noto-cjk fonts-wqy-zenhei

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          retry() { for i in 1 2 3; do "$@" && return 0; echo "第 $i 次失败，15s 后重试: $*"; sleep 15; done; return 1; }
          python -m pip install --upgrade pip
          retry pip install --no-input playwright requests
          # chromium 下载是最容易超时的一步，单独重试
          retry playwright install chromium

      - name: Capture Screenshots
        env:
          TARGET_URL: 'https://zaobao-v2.hdilp.top'
        run: python capture_zaobao.py

      - name: Upload and Publish
        id: publish
        run: python publish_zaobao.py

      - name: Commit publish state
        if: steps.publish.outputs.published == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publish_state.json
          if git diff --staged --quiet; then
            echo "状态文件无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 记录早报发布状态 $(TZ=Asia/Shanghai date +%F) [skip ci]"
          # 避免与其它提交冲突
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # 保留产物方便排查
      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-backup
          path: screenshots/
          retention-days: 3
